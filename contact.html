<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Guide</title>
  <link href="favicon.svg" rel="icon" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body class="landing-page-body learn-page-body">


  <!-- Header -->
  <header class="landing-header" style="position:absolute; top:0; left:0; width:100%; display:flex; align-items:center; justify-content:space-between; padding:1rem 2rem; z-index:1000;">
    <a href="index.html" class="landing-logo-link" aria-label="THYS Homepage">
      <img src="logo.svg" alt="THYS Logo" class="landing-logo" draggable="false" style="-webkit-user-drag: none; user-drag: none;"/>
    </a>
    <div style="display:flex; align-items:center; margin-left:auto;">
      <button class="landing-menu-toggle" aria-label="Toggle Menu" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" stroke="#000" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <nav id="landing-navigation" class="landing-nav" aria-hidden="true" style="display:none;">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="learn.html">Learn</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main role="main" style="text-align:center; margin-top:0;">
    <div class="hero-simple" style="position:relative; width:100vw; height:100vh; overflow:hidden;">
      <img src="contactbackground.webp" alt="Contact Background" draggable="false" style="width:100vw; height:100vh; object-fit:cover; display:block; -webkit-user-drag:none; user-drag:none;">
      <div class="contact-text-container" style="position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); text-align:center;">
        <p class="contact-email-line1">Email:</p>
        <p class="contact-email-line2">info@thys.co</p>
        <div class="contact-instagram-container">
          <a href="https://www.instagram.com/thisisthys/" target="_blank" rel="noopener">
            <img src="instagramicon.webp" alt="Instagram" draggable="false" style="width:40px; height:auto; -webkit-user-drag:none; user-drag:none;"/>
          </a>
        </div>
      </div>
    </div>

</main>
  <script src="script.js" defer></script>

</body>
</html>
