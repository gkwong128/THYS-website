<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>THYS - Learn</title>
  <link rel="icon" href="/favicon.png" sizes="48x48" type="image/png" />
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/loader.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/legacy.css">
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body class="learn-page-body landing-page-body landing-loading">
  <div id="loading-screen">
    <div id="loading-text"></div>
  </div>

  <!-- Header -->
  <header class="landing-header" style="position:absolute; top:0; left:0; width:100%; display:flex; align-items:center; justify-content:space-between; padding:1rem 2rem; z-index:1000;">
    <a href="index.html" class="landing-logo-link" aria-label="THYS Homepage">
      <img src="logo.svg" alt="THYS Logo" class="landing-logo"/>
    </a>
    <div style="display:flex; align-items:center; margin-left:auto;">
      <button class="landing-menu-toggle" aria-label="Toggle Menu" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" stroke="#fff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <nav id="landing-navigation" class="landing-nav" aria-hidden="true">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="learn.html" aria-current="page">Learn</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main role="main" style="text-align:center; margin-top:4rem;">
    <div class="hero-simple" style="position:fixed; top:0; left:0; width:100vw; height:100vh; overflow:hidden; z-index:-1;">
      <img src="productpagebackground.webp" alt="Product Guide Preview" draggable="false" style="width:100vw; height:100vh; object-fit:cover; display:block; -webkit-user-drag:none; user-drag:none;">
      <h1 style="position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); color:#000000; font-family:var(--font-heading); font-size:2rem; margin:0; padding:0 1rem; text-align:center; z-index:1;">
        the desire for transformation is by design
      </h1>
      <!-- Learn page “You are human” animation -->
      <div class="hero-human-animation" role="status" aria-hidden="true"
           style="position:absolute; top:50%; left:50%; z-index:1; color:#000000; font-family:var(--font-heading); font-size:2rem;">
        <span id="loading-prefix">You are </span>
        <span id="loading-word"></span>
      </div>
    </div>
    <!-- Download button and popup removed -->
  </main>

  <!-- Removed: #timer-popup and its children -->

  <script src="js/loader.js" defer></script>
  <script src="js/ui.js" defer></script>
</body>
</html>
